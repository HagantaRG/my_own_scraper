[project]
name = "my-own-scraper"
version = "0.1.0"
description = "A stock-exchange and news scraper."
requires-python = ">=3.12,<4.0"
dependencies = [
    "python-dateutil~=2.9.0.post0",
    "tzdata~=2026.1",
    "schedule~=1.2.2",
    "selenium~=4.43.0",
    "seleniumbase~=4.48.4",
    "requests~=2.33.1",
    "google-api-python-client~=2.198.0",
    "google-auth-httplib2~=0.4.0",
    "black (>=26.5.1,<27.0.0)",
    "filelock (>=3.32.2,<4.0.0)",
]

[tool.poetry]
# The repository uses src itself as the importable top-level package.
packages = [{ include = "src", from = "." }]

[tool.poetry.group.dev.dependencies]
# Ruff provides both linting and formatting from the project environment.
ruff = "^0.16.1"

[tool.ruff]
# Keep Ruff focused on the application source tree.
line-length = 88
target-version = "py312"
src = ["src"]

# Enable the project-wide checks currently used during cleanup.
lint.select = ["E", "F", "I", "UP", "SIM", "DTZ", "LOG", "RET", "BLE", "PL", "PIE", "C", "RUF"]
lint.ignore = ["E501"]
lint.per-file-ignores = { "src/scrapers/exchange_scrapers.py" = ["C901", "PLR0915"] }

# Keep formatting and import optimization enabled through Ruff.
format.quote-style = "double"
format.indent-style = "space"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
