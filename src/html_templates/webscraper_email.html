<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Exchange Daily Webscraper</title>
  <style>
    body { margin: 0; padding: 0; background: #f3f6fa; color: #243247; font-family: Arial, Helvetica, sans-serif; }
    .wrapper { width: 100%; padding: 32px 12px; }
    .card { max-width: 680px; margin: 0 auto; overflow: hidden; border: 1px solid #dfe6ef; border-radius: 12px; background: #ffffff; }
    .header { padding: 30px 36px; background: #12355b; color: #ffffff; }
    .eyebrow { margin: 0 0 8px; color: #b9d5ee; font-size: 12px; font-weight: bold; letter-spacing: 1.2px; text-transform: uppercase; }
    h1 { margin: 0 0 10px; font-size: 26px; line-height: 1.25; }
    .date { margin: 0; color: #dceaf6; font-size: 14px; }
    .content { padding: 28px 36px 36px; }
    .summary { margin: 0 0 24px; color: #52657a; font-size: 15px; }
    .section { margin: 0 0 28px; }
    .section-title { margin: 0 0 10px; padding-bottom: 8px; border-bottom: 2px solid #e3edf6; color: #12355b; font-size: 18px; }
    .article { padding: 12px 0; border-bottom: 1px solid #edf1f5; }
    .article-link { color: #0969a9; font-size: 15px; font-weight: bold; line-height: 1.45; text-decoration: none; }
    .article-meta { margin-top: 5px; color: #68788a; font-size: 12px; }
    .alert { margin: 0 0 24px; padding: 14px 18px; border-left: 4px solid #c2413b; background: #fff1f0; color: #7a2925; font-size: 14px; }
    .alert ul { margin: 8px 0 0; padding-left: 20px; }
    .empty-state { padding: 20px; border-radius: 8px; background: #f7f9fc; color: #68788a; text-align: center; }
    .footer { padding: 18px 36px; background: #f7f9fc; color: #7b8998; font-size: 12px; text-align: center; }
    @media only screen and (max-width: 600px) { .wrapper { padding: 0; } .card { border-radius: 0; } .header, .content { padding-left: 22px; padding-right: 22px; } }
  </style>
</head>
<body>
  <div class="wrapper"><div class="card">
    <div class="header"><p class="eyebrow">Daily report</p><h1>Stock Exchange Articles</h1><p class="date">${report_date}</p></div>
    <div class="content"><p class="summary">${summary}</p>${failure_notice}${sections}</div>
    <div class="footer">Automated report from Stock Exchange Daily Webscraper</div>
  </div></div>
</body>
</html>
